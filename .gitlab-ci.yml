stages:
  - build
  - deploy

build:
  stage: build
  image: docker:latest
  services:
    - name: "docker:dind"
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build . -t raidzin/raidzin:latest
    - docker login -u $DOCKER_USER -p $DOCKER_TOKEN
    - docker push raidzin/raidzin:latest

